name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: elaka360
          POSTGRES_PASSWORD: elaka360
          POSTGRES_DB: elaka360
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U elaka360" --health-interval 5s --health-timeout 5s --health-retries 20
      typesense:
        image: typesense/typesense:27.1
        env:
          TYPESENSE_API_KEY: ci-key
          TYPESENSE_DATA_DIR: /tmp
          TYPESENSE_ENABLE_CORS: "true"
        ports: ["8108:8108"]
    env:
      DATABASE_URL: postgres://elaka360:elaka360@localhost:5432/elaka360
      API_URL: http://localhost:4000
      WEB_URL: http://localhost:3000
      ADMIN_URL: http://localhost:3001
      TYPESENSE_URL: http://localhost:8108
      TYPESENSE_API_KEY: ci-key
      SEARCH_ENGINE_EXPECT: typesense
      # Test-only settings: OTP codes are returned in API responses (refused when NODE_ENV=production).
      SMS_PROVIDER: dev
      OTP_RATE_PER_MIN: "200"
      OTP_PER_PHONE_15M: "20"
      THROTTLE_SCALE: "20"
      AUTH_JWT_SECRET: ci-only-secret-ci-only-secret-0000000
      TURBO_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Seed — reproducible, valid, tested
        run: |
          python3 -m unittest pipelines/test_pipeline.py
          python3 pipelines/build_seed.py > /dev/null
          git diff --stat --exit-code -- data/seed db/seed apps/web/public/geo apps/web/public/data docs/data/SOURCE_REGISTRY.md docs/data/UNRESOLVED_CONFLICTS.md
          python3 pipelines/validate_seed.py

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint && pnpm lint:root

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Database — migrate + seed
        run: bash scripts/db-reset.sh

      - name: Database — production migrator is idempotent and checksum-safe
        run: |
          psql "$DATABASE_URL" -c "CREATE DATABASE migrate_check"
          DATABASE_URL=postgres://elaka360:elaka360@localhost:5432/migrate_check bash scripts/db-migrate.sh
          DATABASE_URL=postgres://elaka360:elaka360@localhost:5432/migrate_check bash scripts/db-migrate.sh | grep -q "up to date"

      - name: Database — check every API query
        run: python3 scripts/check_sql.py

      - name: Search — build Typesense index
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:8108/health && break; sleep 1; done
          pnpm --filter @elaka360/api search:reindex

      - name: Start API
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf $API_URL/health && break; sleep 1; done

      - name: API smoke + integration tests (labelled visibility, the default)
        run: |
          node scripts/smoke-api.mjs
          node --test scripts/integration-api.test.mjs

      - name: API smoke + integration tests (strict visibility, staff 2FA required)
        run: |
          PUBLIC_INCLUDE_UNVERIFIED=false STAFF_REQUIRE_2FA=true API_PORT=4001 node apps/api/dist/main.js > api-strict.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4001/health && break; sleep 1; done
          API_URL=http://localhost:4001 node scripts/smoke-api.mjs
          API_URL=http://localhost:4001 node --test scripts/integration-api.test.mjs

      - name: Start web + admin
        run: |
          pnpm --filter @elaka360/web start > web.log 2>&1 &
          pnpm --filter @elaka360/admin start > admin.log 2>&1 &
          for i in $(seq 1 40); do curl -sf -o /dev/null $WEB_URL/emergency && break; sleep 1; done
          for i in $(seq 1 40); do curl -sf -o /dev/null $ADMIN_URL/login && break; sleep 1; done

      - name: Web smoke test
        run: node scripts/smoke-web.mjs

      - name: End-to-end (Playwright, mobile + desktop)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Logs
        if: always()
        run: |
          echo "--- api.log"; tail -n 80 api.log || true
          echo "--- web.log"; tail -n 80 web.log || true
          echo "--- admin.log"; tail -n 40 admin.log || true
