services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: elaka360
      POSTGRES_PASSWORD: elaka360
      POSTGRES_DB: elaka360
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elaka360"]
      interval: 5s
      retries: 10

  # Search. Optional: without TYPESENSE_URL the API falls back to Postgres search.
  typesense:
    image: typesense/typesense:27.1
    command: --data-dir /data --api-key=dev-key --enable-cors
    ports: ["8108:8108"]
    volumes: [tsdata:/data]

  # Edge database for the Cloudflare edge API (apps/edge-api): Turso's open-source libSQL server, same protocol as
  # Turso. Load it with `pnpm edge:sync` after `pnpm edge:export`; `pnpm --filter @elaka360/edge-api dev` reads it.
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:v0.24.33
    ports: ["127.0.0.1:8080:8080"]
    volumes: [libsqldata:/var/lib/sqld]

  # Jobs/cache (Phase 2).

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    profiles: ["full"]

volumes:
  pgdata:
  tsdata:
  libsqldata:
